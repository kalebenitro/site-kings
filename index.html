    // ============ NAVEGAÇÃO ============
    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.add('active');
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.tab === tabId) item.classList.add('active');
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (tabId === 'escalacao') renderEscalacao();
    };

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        if (this.dataset.tab) window.switchTab(this.dataset.tab);
      });
    });

    // ============ TOAST ============
    window.mostrarToast = function(mensagem, tipo = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      toast.innerHTML = `<i class="fas ${tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span>${mensagem}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };

    // ============ ROLE SWITCHER ============
    document.querySelectorAll('#role-switcher button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#role-switcher button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        userRole = this.dataset.role;
        document.getElementById('user-avatar').textContent = userRole === 'admin' ? 'AD' : 'OB';
        document.getElementById('user-name').textContent = userRole === 'admin' ? 'Administrador' : 'Observador';
        document.getElementById('user-role').textContent = userRole === 'admin' ? '👑 Acesso Total' : '👁️ Somente leitura';
        aplicarPermissoes();
        renderEscalacao();
      });
    });

    function aplicarPermissoes() {
      const isAdmin = userRole === 'admin';
      document.querySelectorAll('#btn-editar-escalacao, #btn-publicar-escalacao, #btn-add-jogador, #btn-trocar-jogador, #btn-remover-jogador, #btn-desfazer, #btn-resetar-escalacao, #btn-salvar-escalacao').forEach(btn => {
        if (btn) btn.style.display = isAdmin ? '' : 'none';
      });
      if (isAdmin) {
        document.getElementById('btn-editar-escalacao').style.display = '';
      }
      if (!isAdmin) {
        document.getElementById('btn-editar-escalacao').style.display = 'none';
        document.getElementById('btn-publicar-escalacao').style.display = 'none';
        document.getElementById('painel-edicao').style.display = 'none';
        document.getElementById('match-info-edit').style.display = 'none';
        document.getElementById('match-info-display').style.display = '';
        document.getElementById('select-formacao').disabled = true;
        editando = false;
      }
    }

    // ============ STATUS SYNC ============
    function atualizarStatusSync(status, texto) {
      const el = document.getElementById('sync-status');
      const txt = document.getElementById('sync-text');
      if (el && txt) { el.className = 'sync-status ' + status; txt.textContent = texto; }
    }

    // ============ INTERFACE PRINCIPAL ============
    function atualizarInterface() {
      atualizarContadoresPainel();
      atualizarDestaques();
      atualizarElenco();
      atualizarRankings();
      atualizarAtividades();
      atualizarCardsTopo();
      renderEscalacao();
    }

    function atualizarContadoresPainel() {
      const total = jogadores.length;
      const disponiveis = jogadores.filter(j => j.status === 'Disponível').length;
      const lesionados = jogadores.filter(j => j.status === 'Em recuperação' || j.status === 'Indisponível').length;
      const a = document.getElementById('player-count'); if (a) a.textContent = total;
      const b = document.getElementById('available-count'); if (b) b.textContent = disponiveis;
      const c = document.getElementById('injured-count'); if (c) c.textContent = lesionados;
    }

    function atualizarCardsTopo() {
      const artilheiro = [...jogadores].sort((a, b) => (b.gols || 0) - (a.gols || 0))[0];
      const e1 = document.getElementById('top-scorer'); const e1s = document.getElementById('top-scorer-sub');
      if (e1) {
        if (artilheiro && artilheiro.gols > 0) { e1.textContent = artilheiro.apelido || artilheiro.nome; e1s.innerHTML = `<span class="gold-text">${artilheiro.gols}</span> gols · ${artilheiro.jogos || 0} jogos`; }
        else { e1.textContent = '—'; e1s.textContent = jogadores.length ? 'Nenhum gol marcado' : 'Nenhum jogador'; }
      }
      const assistente = [...jogadores].sort((a, b) => (b.assistencias || 0) - (a.assistencias || 0))[0];
      const e2 = document.getElementById('top-assister'); const e2s = document.getElementById('top-assister-sub');
      if (e2) {
        if (assistente && assistente.assistencias > 0) { e2.textContent = assistente.apelido || assistente.nome; e2s.innerHTML = `<span class="gold-text">${assistente.assistencias}</span> assistências`; }
        else { e2.textContent = '—'; e2s.textContent = jogadores.length ? 'Nenhuma assistência' : 'Nenhum jogador'; }
      }
      const melhor = [...jogadores].filter(j => j.nota).sort((a, b) => b.nota - a.nota)[0];
      const e3 = document.getElementById('top-rating'); const e3s = document.getElementById('top-rating-sub');
      if (e3) {
        if (melhor && melhor.nota) { e3.textContent = melhor.apelido || melhor.nome; e3s.innerHTML = `<span class="gold-text">${melhor.nota}</span> de média`; }
        else { e3.textContent = '—'; e3s.textContent = 'Nenhum jogador'; }
      }
    }

    function atualizarDestaques() {
      const tbody = document.getElementById('destaques-body');
      if (!tbody) return;
      if (jogadores.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 30px; color: rgba(255,255,255,0.4);"><i class="fas fa-user-plus" style="font-size: 24px; display: block; margin-bottom: 8px; color: var(--dourado); opacity: 0.5;"></i>Nenhum jogador cadastrado.</td></tr>`;
        return;
      }
      const ordenados = [...jogadores].sort((a, b) => (b.nota || 0) - (a.nota || 0)).slice(0, 5);
      tbody.innerHTML = ordenados.map(j => {
        const cls = j.status === 'Disponível' ? 'badge-green' : j.status === 'Em recuperação' ? 'badge-yellow' : 'badge-red';
        return `<tr><td><strong>${j.apelido || j.nome}</strong> <span style="color:rgba(255,255,255,0.4);font-size:12px;">#${j.numero}</span></td><td>${j.posicao}</td><td>${j.jogos || 0}</td><td><span class="gold-text">${j.gols || 0}</span></td><td>${j.assistencias || 0}</td><td><span class="badge badge-gold">${j.nota || '—'}</span></td><td><span class="badge ${cls}">${j.status}</span></td></tr>`;
      }).join('');
    }

    function atualizarElenco() {
      const tbody = document.getElementById('elenco-body');
      if (!tbody) return;
      if (jogadores.length === 0) { tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 30px; color: rgba(255,255,255,0.4);">Nenhum jogador cadastrado ainda.</td></tr>`; return; }
      tbody.innerHTML = jogadores.map(j => {
        const cls = j.status === 'Disponível' ? 'badge-green' : j.status === 'Em recuperação' ? 'badge-yellow' : 'badge-red';
        return `<tr><td><span style="color:var(--dourado);font-weight:700;">#${j.numero}</span></td><td><strong>${j.nome}</strong></td><td>${j.apelido || '—'}</td><td>${j.posicao}</td><td>${j.pe}</td><td>${j.idade || '—'}</td><td><span class="badge ${cls}">${j.status}</span></td><td><button class="btn btn-outline btn-sm" onclick="excluirJogador('${j.id}')" style="border-color: rgba(198,40,40,0.4); color: #EB5757;"><i class="fas fa-trash"></i></button></td></tr>`;
      }).join('');
    }

    function atualizarRankings() {
      const artEl = document.getElementById('ranking-artilharia');
      if (artEl) {
        if (jogadores.length === 0) artEl.innerHTML = '<div class="empty-state" style="padding:16px;"><p>Sem dados</p></div>';
        else { const ord = [...jogadores].sort((a, b) => (b.gols || 0) - (a.gols || 0)).slice(0, 3); artEl.innerHTML = ord.map((j, i) => `<div style="display:flex; justify-content:space-between; padding:6px 0; ${i < 2 ? 'border-bottom:1px solid rgba(255,255,255,0.05);' : ''}"><span>${i+1}. ${j.apelido || j.nome}</span><span class="${i === 0 ? 'gold-text' : ''}">${j.gols || 0}</span></div>`).join(''); }
      }
      const assEl = document.getElementById('ranking-assistencias');
      if (assEl) {
        if (jogadores.length === 0) assEl.innerHTML = '<div class="empty-state" style="padding:16px;"><p>Sem dados</p></div>';
        else { const ord = [...jogadores].sort((a, b) => (b.assistencias || 0) - (a.assistencias || 0)).slice(0, 3); assEl.innerHTML = ord.map((j, i) => `<div style="display:flex; justify-content:space-between; padding:6px 0; ${i < 2 ? 'border-bottom:1px solid rgba(255,255,255,0.05);' : ''}"><span>${i+1}. ${j.apelido || j.nome}</span><span class="${i === 0 ? 'gold-text' : ''}">${j.assistencias || 0}</span></div>`).join(''); }
      }
      const medEl = document.getElementById('ranking-media');
      if (medEl) {
        if (jogadores.length === 0) medEl.innerHTML = '<div class="empty-state" style="padding:16px;"><p>Sem dados</p></div>';
        else { const cn = jogadores.filter(j => j.nota).sort((a, b) => b.nota - a.nota).slice(0, 3); medEl.innerHTML = cn.length === 0 ? '<div class="empty-state" style="padding:16px;"><p>Sem dados</p></div>' : cn.map((j, i) => `<div style="display:flex; justify-content:space-between; padding:6px 0; ${i < cn.length - 1 ? 'border-bottom:1px solid rgba(255,255,255,0.05);' : ''}"><span>${i+1}. ${j.apelido || j.nome}</span><span class="${i === 0 ? 'gold-text' : ''}">${j.nota}</span></div>`).join(''); }
      }
    }

    function atualizarAtividades() {
      const lista = document.getElementById('activity-list');
      if (!lista) return;
      if (jogadores.length === 0) { lista.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>Nenhuma atividade registrada ainda.</p></div>`; return; }
      const rec = jogadores.slice(-5).reverse();
      lista.innerHTML = rec.map(j => `<div class="activity-item"><div class="activity-icon"><i class="fas fa-user-plus"></i></div><div class="activity-text"><strong>Jogador adicionado</strong> — ${j.nome} (${j.posicao})</div><div class="activity-time">recente</div></div>`).join('');
    }

    window.excluirJogador = async function(id) {
      const j = jogadores.find(x => String(x.id) === String(id));
      if (!j) return;
      if (!confirm(`Tem certeza que deseja excluir ${j.nome}?`)) return;
      try { await remove(ref(db, `kings/jogadores/${id}`)); mostrarToast(`${j.nome} foi excluído.`, 'error'); }
      catch (err) { console.error(err); mostrarToast('Erro ao excluir. Tente novamente.', 'error'); }
    };

    // ============================================

        { id:'VOL', label:'VOL', x:50, y:62 },
        { id:'ME', label:'ME', x:15, y:42 }, { id:'MC1', label:'MC', x:38, y:44 }, { id:'MC2', label:'MC', x:62, y:44 }, { id:'MD', label:'MD', x:85, y:42 },
        { id:'ATA', label:'ATA', x:50, y:14 }
      ],
      'Personalizada': [
        { id:'GOL', label:'GOL', x:50, y:92 },
        { id:'LE', label:'LE', x:15, y:74 }, { id:'ZAG1', label:'ZAG', x:38, y:78 }, { id:'ZAG2', label:'ZAG', x:62, y:78 }, { id:'LD', label:'LD', x:85, y:74 },
        { id:'VOL', label:'VOL', x:50, y:58 },
        { id:'MC1', label:'MC', x:30, y:42 }, { id:'MC2', label:'MC', x:70, y:42 },
        { id:'PE', label:'PE', x:18, y:20 }, { id:'ATA', label:'ATA', x:50, y:14 }, { id:'PD', label:'PD', x:82, y:20 }
      ]
    };

    let escalacao = {
      formacao: '4-3-3',
      slots: {},          // slotId -> jogadorId
      posicoesCustom: {}, // slotId -> {x, y}
      reservas: [],       // [jogadorId]
      partida: { oponente:'Adversário', competicao:'Campeonato', data:'', hora:'', local:'' },
      publicada: false,
      atualizadaEm: null
    };
    let editando = false;
    let historico = [];
    let slotSelecionado = null;
    let dragData = null;

    function salvarHistorico() {
      historico.push(JSON.stringify({ slots: escalacao.slots, posicoesCustom: escalacao.posicoesCustom, reservas: escalacao.reservas }));
      if (historico.length > 30) historico.shift();
    }

    function getFormacaoAtual() {
      return FORMATIONS[escalacao.formacao] || FORMATIONS['4-3-3'];
    }

    function getJogador(id) {
      return jogadores.find(j => String(j.id) === String(id));
    }

    function iniciais(nome) {
      if (!nome) return '?';
      return nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
    }

    function avatarHTML(j) {
      if (j && j.foto) return `<img src="${j.foto}" alt="${j.nome}">`;
      return iniciais(j ? (j.apelido || j.nome) : '?');
    }

    function categoriaPosicao(pos) {
      if (!pos) return 'Outros';
      if (pos === 'Goleiro') return 'Goleiro';
      if (['Zagueiro','Lateral'].includes(pos)) return 'Defensor';
      if (['Volante','Meia'].includes(pos)) return 'Meia';
      if (['Ponta','Atacante'].includes(pos)) return 'Atacante';
      return 'Outros';
    }

    function labelParaCategoria(cat) {
      const map = { 'Goleiro':'GOL', 'Defensor':'DEF', 'Meia':'MEI', 'Atacante':'ATA', 'Outros':'JOG' };
      return map[cat] || 'JOG';
    }

    function renderEscalacao() {
      renderCampo();
      renderBanco();
      renderListasLaterais();
      renderMatchInfo();
      document.getElementById('select-formacao').value = escalacao.formacao;
      document.getElementById('escalacao-oficial-badge').style.display = escalacao.publicada ? 'block' : 'none';
      document.getElementById('btn-publicar-escalacao').style.display = (userRole === 'admin' && escalacao.publicada === false) ? '' : 'none';
    }

    function renderMatchInfo() {
      const p = escalacao.partida || {};
      document.getElementById('match-oponente').textContent = p.oponente || 'Adversário';
      document.getElementById('match-competicao').textContent = p.competicao || 'Campeonato';
      document.getElementById('match-data').textContent = p.data ? formatarData(p.data) : '—';
      document.getElementById('match-hora').textContent = p.hora || '—';
      document.getElementById('match-local').textContent = p.local || '—';
      document.getElementById('input-oponente').value = p.oponente || '';
      document.getElementById('input-competicao').value = p.competicao || '';
      document.getElementById('input-data').value = p.data || '';
      document.getElementById('input-hora').value = p.hora || '';
      document.getElementById('input-local').value = p.local || '';
    }

    function formatarData(iso) {
      if (!iso) return '—';
      const [a, m, d] = iso.split('-');
      return `${d}/${m}/${a}`;
    }

    function renderCampo() {
      const container = document.getElementById('field-players');
      if (!container) return;
      container.innerHTML = '';
      const slots = getFormacaoAtual();
      slots.forEach(slot => {
        const jogId = escalacao.slots[slot.id];
        const jog = jogId ? getJogador(jogId) : null;
        const custom = escalacao.posicoesCustom[slot.id];
        const x = custom ? custom.x : slot.x;
        const y = custom ? custom.y : slot.y;

        const div = document.createElement('div');
        div.className = 'player-slot' + (jog ? '' : ' empty');
        div.style.left = x + '%';
        div.style.top = y + '%';
        div.dataset.slotId = slot.id;
        div.draggable = editando && userRole === 'admin';

        div.innerHTML = `
          <div class="slot-avatar">${jog ? avatarHTML(jog) : '<i class="fas fa-user" style="opacity:0.5;"></i>'}</div>
          <div class="slot-name">${jog ? (jog.apelido || jog.nome) : slot.label}</div>
          <div class="slot-position">${slot.label}</div>
        `;

        div.addEventListener('click', () => {
          if (editando && userRole === 'admin' && jog) abrirModalEditar(slot.id, jogId);
        });

        if (editando && userRole === 'admin') {
          div.addEventListener('dragstart', (e) => {
            dragData = { tipo: 'campo', slotId: slot.id, jogId };
            div.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          div.addEventListener('dragend', () => { div.classList.remove('dragging'); document.querySelectorAll('.player-slot').forEach(s => s.classList.remove('drag-over')); });
          div.addEventListener('dragover', (e) => { e.preventDefault(); div.classList.add('drag-over'); });
          div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
          div.addEventListener('drop', (e) => {
            e.preventDefault();
            div.classList.remove('drag-over');
            if (!dragData) return;
            salvarHistorico();
            if (dragData.tipo === 'campo') {
              const origem = dragData.slotId;
              const destino = slot.id;
              if (origem === destino) return;
              const jogOrigem = escalacao.slots[origem];
              const jogDestino = escalacao.slots[destino];
              escalacao.slots[destino] = jogOrigem;
              if (jogDestino) escalacao.slots[origem] = jogDestino;
              else delete escalacao.slots[origem];
              // reverter posições custom para o padrão para "encaixar"
              if (escalacao.formacao === 'Personalizada' || true) {
                const slotsArr = getFormacaoAtual();
                const sOrig = slotsArr.find(s => s.id === origem);
                const sDest = slotsArr.find(s => s.id === destino);
                if (sOrig && sDest) {
                  if (!escalacao.posicoesCustom[origem]) escalacao.posicoesCustom[origem] = { x: sOrig.x, y: sOrig.y };
                  if (!escalacao.posicoesCustom[destino]) escalacao.posicoesCustom[destino] = { x: sDest.x, y: sDest.y };
                }
              }
            } else if (dragData.tipo === 'reserva') {
              const jogId = dragData.jogId;
              const destino = slot.id;
              const jogDestino = escalacao.slots[destino];
              if (jogDestino) {
                escalacao.reservas = escalacao.reservas.filter(id => String(id) !== String(jogDestino));
                escalacao.reservas.push(jogDestino);
              }
              escalacao.slots[destino] = jogId;
              escalacao.reservas = escalacao.reservas.filter(id => String(id) !== String(jogId));
            }
            dragData = null;
            renderEscalacao();
          });
        }
        container.appendChild(div);
      });
    }

    function renderBanco() {
      const banco = document.getElementById('banco-reservas');
      const cnt = document.getElementById('banco-count');
      if (!banco) return;
      cnt.textContent = `${escalacao.reservas.length} reserva${escalacao.reservas.length === 1 ? '' : 's'}`;
      if (escalacao.reservas.length === 0) {
        banco.innerHTML = '<div class="empty-state" style="padding:24px;"><i class="fas fa-chair"></i><p>Nenhum reserva. Adicione jogadores ao elenco da partida.</p></div>';
        return;
      }
      banco.innerHTML = escalacao.reservas.map(id => {
        const j = getJogador(id);
        if (!j) return '';
        return `<div class="reserva-card" draggable="${editando && userRole === 'admin'}" data-jog-id="${j.id}">
          <div class="res-avatar">${avatarHTML(j)}</div>
          <div class="res-info"><span class="res-name">${j.apelido || j.nome}</span><span class="res-meta">#${j.numero} · ${j.posicao}</span></div>
          ${(editando && userRole === 'admin') ? `<button class="sq-remove" onclick="removerReserva('${j.id}')" title="Remover do banco"><i class="fas fa-times"></i></button>` : ''}
        </div>`;
      }).join('');

      banco.querySelectorAll('.reserva-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          dragData = { tipo: 'reserva', jogId: card.dataset.jogId };
          card.style.opacity = '0.5';
        });
        card.addEventListener('dragend', () => { card.style.opacity = ''; });
      });
    }

    window.removerReserva = function(jogId) {
      salvarHistorico();
      escalacao.reservas = escalacao.reservas.filter(id => String(id) !== String(jogId));
      renderEscalacao();
    };

    function renderListasLaterais() {
      const titularesIds = Object.values(escalacao.slots);
      const titulares = titularesIds.map(id => getJogador(id)).filter(Boolean);
      const reservas = escalacao.reservas.map(id => getJogador(id)).filter(Boolean);
      const naoRel = jogadores.filter(j => !titularesIds.some(id => String(id) === String(j.id)) && !escalacao.reservas.some(id => String(id) === String(j.id)));

      document.getElementById('titulares-count').textContent = `(${titulares.length}/11)`;
      document.getElementById('reservas-count').textContent = `(${reservas.length})`;
      document.getElementById('nao-rel-count').textContent = `(${naoRel.length})`;

      const listaTit = document.getElementById('lista-titulares');
      listaTit.innerHTML = titulares.length === 0 ? '<p class="squad-empty">Nenhum titular</p>' : titulares.map(j => `
        <div class="squad-item"><span class="sq-num">#${j.numero}</span><span class="sq-name">${j.apelido || j.nome}</span><span class="sq-pos">${j.posicao}</span></div>
      `).join('');

      const listaRes = document.getElementById('lista-reservas');
      listaRes.innerHTML = reservas.length === 0 ? '<p class="squad-empty">Nenhum reserva</p>' : reservas.map(j => `
        <div class="squad-item"><span class="sq-num">#${j.numero}</span><span class="sq-name">${j.apelido || j.nome}</span><span class="sq-pos">${j.posicao}</span>${(editando && userRole === 'admin') ? `<button class="sq-remove" onclick="removerReserva('${j.id}')"><i class="fas fa-times"></i></button>` : ''}</div>
      `).join('');

      const listaNao = document.getElementById('lista-nao-relacionados');
      listaNao.innerHTML = naoRel.length === 0 ? '<p class="squad-empty">Todos relacionados</p>' : naoRel.map(j => `
        <div class="squad-item"><span class="sq-num">#${j.numero}</span><span class="sq-name">${j.apelido || j.nome}</span><span class="sq-pos">${j.posicao}</span>${(editando && userRole === 'admin') ? `<button class="sq-remove" style="color:#6FCF97;" onclick="adicionarAoBanco('${j.id}')" title="Adicionar ao banco"><i class="fas fa-plus"></i></button>` : ''}</div>
      `).join('');
    }

    window.adicionarAoBanco = function(jogId) {
      if (!escalacao.reservas.some(id => String(id) === String(jogId))) {
        salvarHistorico();
        escalacao.reservas.push(jogId);
        renderEscalacao();
      }
    };

    // ============ BOTÕES DE EDIÇÃO ============
    document.getElementById('btn-editar-escalacao').addEventListener('click', () => {
      if (userRole !== 'admin') return;
      editando = !editando;
      document.getElementById('painel-edicao').style.display = editando ? 'block' : 'none';
      document.getElementById('match-info-edit').style.display = editando ? 'grid' : 'none';
      document.getElementById('match-info-display').style.display = editando ? 'none' : 'block';
      document.getElementById('select-formacao').disabled = !editando;
      document.getElementById('formacao-hint').innerHTML = editando ? '<i class="fas fa-pen"></i> Editando...' : '<i class="fas fa-info-circle"></i> Clique em "Editar Escalação" para alterar';
      document.getElementById('btn-editar-escalacao').innerHTML = editando ? '<i class="fas fa-check"></i> Concluir Edição' : '<i class="fas fa-cog"></i> Editar Escalação';
      renderEscalacao();
    });

    document.getElementById('btn-add-jogador').addEventListener('click', () => { salvarHistorico(); abrirModalJogadores('adicionar'); });
    document.getElementById('btn-trocar-jogador').addEventListener('click', () => { abrirModalJogadores('trocar'); });

    document.getElementById('btn-remover-jogador').addEventListener('click', () => {
      if (slotSelecionado) { removerSlot(slotSelecionado); slotSelecionado = null; }
      else mostrarToast('Clique em um jogador do campo primeiro.', 'error');
    });

    document.getElementById('btn-desfazer').addEventListener('click', () => {
      if (historico.length === 0) { mostrarToast('Nada para desfazer.', 'error'); return; }
      const snap = JSON.parse(historico.pop());
      escalacao.slots = snap.slots;
      escalacao.posicoesCustom = snap.posicoesCustom;
      escalacao.reservas = snap.reservas;
      renderEscalacao();
      mostrarToast('Alteração desfeita.', 'success');
    });

    document.getElementById('btn-resetar-escalacao').addEventListener('click', () => {
      abrirModalConfirmar('Tem certeza que deseja resetar a escalação? Todos os titulares e reservas serão removidos.', () => {
        salvarHistorico();
        escalacao.slots = {};
        escalacao.posicoesCustom = {};
        escalacao.reservas = [];
        escalacao.publicada = false;
        renderEscalacao();
        fecharModalConfirmar();
        mostrarToast('Escalação resetada.', 'success');
      });
    });

    document.getElementById('btn-salvar-escalacao').addEventListener('click', async () => {
      if (userRole !== 'admin') return;
      escalacao.partida = {
        oponente: document.getElementById('input-oponente').value.trim() || 'Adversário',
        competicao: document.getElementById('input-competicao').value.trim() || 'Campeonato',
        data: document.getElementById('input-data').value,
        hora: document.getElementById('input-hora').value,
        local: document.getElementById('input-local').value.trim()
      };
      escalacao.atualizadaEm = new Date().toISOString();
      try {
        await set(escalacaoRef, escalacao);
        mostrarToast('✅ ESCALAÇÃO SALVA COM SUCESSO', 'success');
      } catch (e) { console.error(e); mostrarToast('Erro ao salvar escalação.', 'error'); }
    });

    document.getElementById('btn-publicar-escalacao').addEventListener('click', async () => {
      if (userRole !== 'admin') return;
      escalacao.publicada = true;
      try {
        await set(escalacaoRef, escalacao);
        mostrarToast('📢 Escalação publicada como OFICIAL!', 'success');
        renderEscalacao();
      } catch (e) { console.error(e); mostrarToast('Erro ao publicar.', 'error'); }
    });

    document.getElementById('select-formacao').addEventListener('change', function() {
      if (userRole !== 'admin' || !editando) return;
      salvarHistorico();
      escalacao.formacao = this.value;
      // limpar posições custom que não pertencem à nova formação
      const ids = getFormacaoAtual().map(s => s.id);
      Object.keys(escalacao.posicoesCustom).forEach(id => { if (!ids.includes(id)) delete escalacao.posicoesCustom[id]; });
      renderEscalacao();
      mostrarToast(`Formação alterada para ${this.value}`, 'success');
    });

    function removerSlot(slotId) {
      salvarHistorico();
      const jogId = escalacao.slots[slotId];
      if (jogId) {
        if (!escalacao.reservas.some(id => String(id) === String(jogId))) escalacao.reservas.push(jogId);
        delete escalacao.slots[slotId];
      }
      renderEscalacao();
      mostrarToast('Jogador removido do campo.', 'success');
    }

    // ============ MODAL JOGADORES ============
    let filtroAtual = 'todos';
    let modoModal = 'adicionar';

    window.abrirModalJogadores = function(modo) {
      modoModal = modo;
      document.getElementById('modal-title-text').textContent = modo === 'adicionar' ? 'Adicionar Jogador' : 'Trocar Jogador';
      document.getElementById('search-jogador').value = '';
      filtroAtual = 'todos';
      document.querySelectorAll('#filter-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'todos'));
      renderJogadoresLista();
      document.getElementById('modal-jogadores').classList.add('active');
    };
    window.fecharModalJogadores = function() { document.getElementById('modal-jogadores').classList.remove('active'); };

    document.getElementById('search-jogador').addEventListener('input', renderJogadoresLista);

    document.querySelectorAll('#filter-chips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#filter-chips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filtroAtual = chip.dataset.filter;
        renderJogadoresLista();
      });
    });

    function renderJogadoresLista() {
      const container = document.getElementById('jogadores-lista');
      const termo = document.getElementById('search-jogador').value.toLowerCase().trim();
      const titularesIds = Object.values(escalacao.slots).map(String);

      let lista = jogadores.filter(j => {
        if (filtroAtual !== 'todos' && categoriaPosicao(j.posicao) !== filtroAtual) return false;
        if (!termo) return true;
        return (j.nome || '').toLowerCase().includes(termo) ||
               (j.apelido || '').toLowerCase().includes(termo) ||
               String(j.numero || '').includes(termo) ||
               (j.posicao || '').toLowerCase().includes(termo);
      });

      if (lista.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding:24px;"><i class="fas fa-user-slash"></i><p>Nenhum jogador encontrado.</p></div>';
        return;
      }

      container.innerHTML = lista.map(j => {
        const escalado = titularesIds.includes(String(j.id)) || escalacao.reservas.some(id => String(id) === String(j.id));
        return `<div class="jogador-item">
          <div class="jg-avatar">${avatarHTML(j)}</div>
          <div class="jg-info">
            <div class="jg-name">${j.nome}${escalado ? '<span class="jg-scaled">✓ ESCALADO</span>' : ''}</div>
            <div class="jg-meta">#${j.numero} · ${j.posicao}</div>
          </div>
          <button class="jg-action" data-jog-id="${j.id}">${modoModal === 'adicionar' ? 'Adicionar' : 'Trocar'}</button>
        </div>`;
      }).join('');

      container.querySelectorAll('.jg-action').forEach(btn => {
        btn.addEventListener('click', () => {
          const jogId = btn.dataset.jogId;
          if (modoModal === 'adicionar') adicionarJogadorAoSquad(jogId);
          else trocarJogador(jogId);
          fecharModalJogadores();
        });
      });
    }

    function adicionarJogadorAoSquad(jogId) {
      const jog = getJogador(jogId);
      if (!jog) return;

      // Achar primeiro slot vazio que combine com a categoria da posição
      const cat = categoriaPosicao(jog.posicao);
      const slots = getFormacaoAtual();
      const vazios = slots.filter(s => !escalacao.slots[s.id]);
      const slotIdeal = vazios.find(s => labelParaCategoria(cat) === s.label) || vazios[0];

      if (slotIdeal) {
        salvarHistorico();
        // Alerta se posição principal diferente
        if (labelParaCategoria(cat) !== slotIdeal.label) {
          abrirModalConfirmar(`⚠️ POSIÇÃO DIFERENTE DA POSIÇÃO PRINCIPAL\n\nEste jogador está cadastrado como ${j.posicao}. Deseja utilizá-lo como ${slotIdeal.label}?`, () => {
            escalacao.slots[slotIdeal.id] = jog.id;
            renderEscalacao();
            fecharModalConfirmar();
            mostrarToast(`${j.apelido || j.nome} adicionado como ${slotIdeal.label}.`, 'success');
          });
          return;
        }
        escalacao.slots[slotIdeal.id] = jog.id;
        renderEscalacao();
        mostrarToast(`${j.apelido || j.nome} adicionado como ${slotIdeal.label}.`, 'success');
      } else {
        // Todos os slots ocupados → vira reserva
        if (!escalacao.reservas.some(id => String(id) === String(jogId))) {
          salvarHistorico();
          escalacao.reservas.push(jogId);
          renderEscalacao();
          mostrarToast(`${j.apelido || jog.nome} adicionado ao banco (campo cheio).`, 'success');
        }
      }
    }

    function trocarJogador(novoJogId) {
      if (!slotSelecionado) { mostrarToast('Selecione um jogador no campo primeiro.', 'error'); return; }
      const jogAntigo = escalacao.slots[slotSelecionado];
      if (jogAntigo && String(jogAntigo) !== String(novoJogId)) {
        if (!escalacao.reservas.some(id => String(id) === String(jogAntigo))) escalacao.reservas.push(jogAntigo);
      }
      salvarHistorico();
      escalacao.slots[slotSelecionado] = novoJogId;
      escalacao.reservas = escalacao.reservas.filter(id => String(id) !== String(novoJogId));
      renderEscalacao();
      const j = getJogador(novoJogId);
      mostrarToast(`${j.apelido || j.nome} entrou no lugar.`, 'success');
      slotSelecionado = null;
    }

    // ============ MODAL EDITAR JOGADOR NO CAMPO ============
    window.abrirModalEditar = function(slotId, jogId) {
      slotSelecionado = slotId;
      const j = getJogador(jogId);
      if (!j) return;
      const slot = getFormacaoAtual().find(s => s.id === slotId);
      document.getElementById('modal-editar-body').innerHTML = `
        <div class="edit-player-header">
          <div class="ep-avatar">${avatarHTML(j)}</div>
          <div class="ep-info"><h4>${j.nome}</h4><p>#${j.numero} · ${j.posicao} · Slot: ${slot ? slot.label : slotId}</p></div>
        </div>
        <div class="edit-actions">
          <button class="btn btn-gold" onclick="abrirModalJogadores('trocar')"><i class="fas fa-exchange-alt"></i> Trocar</button>
          <button class="btn btn-outline" onclick="removerSlot('${slotId}'); fecharModalEditar();"><i class="fas fa-trash"></i> Remover do Campo</button>
        </div>`;
      document.getElementById('modal-editar-jogador').classList.add('active');
    };
    window.fecharModalEditar = function() { document.getElementById('modal-editar-jogador').classList.remove('active'); };

    // ============ MODAL CONFIRMAR ============
    let acaoConfirmar = null;
    window.abrirModalConfirmar = function(texto, acao) {
      document.getElementById('confirmar-texto').textContent = texto;
      acaoConfirmar = acao;
      document.getElementById('modal-confirmar').classList.add('active');
    };
    window.fecharModalConfirmar = function() { document.getElementById('modal-confirmar').classList.remove('active'); acaoConfirmar = null; };
    document.getElementById('btn-confirmar-acao').addEventListener('click', () => { if (acaoConfirmar) acaoConfirmar(); });

    // ============ FIREBASE LISTENERS ============
    onValue(jogadoresRef, (snapshot) => {
      firebaseConectado = true;
      document.getElementById('loading-overlay').classList.add('hidden');
      atualizarStatusSync('online', 'Sincronizado');
      const dados = snapshot.val();
      jogadores = dados ? Object.values(dados) : [];
      atualizarInterface();
    }, (erro) => {
      firebaseConectado = false;
      document.getElementById('loading-overlay').classList.add('hidden');
      atualizarStatusSync('offline', 'Offline');
      console.error('❌ Erro Firebase:', erro);
      mostrarToast('Erro de conexão. Verifique o Firebase.', 'error');
    });

    onValue(escalacaoRef, (snapshot) => {
      const dados = snapshot.val();
      if (dados) {
        escalacao = { ...escalacao, ...dados };
        if (!escalacao.slots) escalacao.slots = {};
        if (!escalacao.posicoesCustom) escalacao.posicoesCustom = {};
        if (!escalacao.reservas) escalacao.reservas = [];
        if (!escalacao.partida) escalacao.partida = { oponente:'Adversário', competicao:'Campeonato', data:'', hora:'', local:'' };
      }
      renderEscalacao();
    });

    // ============ FORM PLAYER ============
    document.getElementById('player-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!firebaseConectado) { mostrarToast('Aguarde a conexão com o servidor...', 'error'); return; }
      const nome = document.getElementById('player-name').value.trim();
      const apelido = document.getElementById('player-nickname').value.trim();
      const numero = parseInt(document.getElementById('player-number').value) || 0;
      const posicao = document.getElementById('player-position').value;
      const pe = document.getElementById('player-foot').value;
      const idade = parseInt(document.getElementById('player-age').value) || null;
      const altura = parseInt(document.getElementById('player-height').value) || null;
      const status = document.getElementById('player-status').value;
      const observacoes = document.getElementById('player-notes').value.trim();
      if (!nome || !numero || !posicao) { mostrarToast('Preencha os campos obrigatórios.', 'error'); return; }
      if (jogadores.some(j => j.numero === numero)) { mostrarToast(`O número #${numero} já está em uso.`, 'error'); return; }
      const id = Date.now().toString();
      const novoJogador = { id, nome, apelido: apelido || nome.split(' ')[0], numero, posicao, pe, idade: idade || '—', altura: altura || '—', status, observacoes, jogos: 0, gols: 0, assistencias: 0, cartoesAmarelos: 0, cartoesVermelhos: 0, minutos: 0, nota: (Math.random() * 2 + 7).toFixed(1), criadoEm: new Date().toISOString() };
      try {
        await set(ref(db, `kings/jogadores/${id}`), novoJogador);
        mostrarToast(`${novoJogador.nome} cadastrado com sucesso!`, 'success');
        this.reset();
      } catch (err) { console.error(err); mostrarToast('Erro ao salvar. Tente novamente.', 'error'); }
    });

    aplicarPermissoes();
    console.log('👑 KINGS — GESTÃO DE FUTEBOL');
    console.log('Pensar. Jogar. Vencer.');
  </script>
</body>
</html>
